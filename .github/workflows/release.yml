name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The claude-notifier/ prefix lets `unzip -d ~/.claude` land in ~/.claude/claude-notifier.
      - run: git archive --format=zip --prefix=claude-notifier/ -o claude-notifier.zip "$TAG"
      - run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" claude-notifier.zip --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" claude-notifier.zip --title "$TAG" --generate-notes --latest
          fi
      # Only a tag push moves the formula, so a manual re-run of an old tag never downgrades brew users.
      # TAP_TOKEN is a fine-grained token with Contents write on keyurgovrani/homebrew-tap only.
      - if: github.event_name == 'push'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          sha=$(sha256sum claude-notifier.zip | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/keyurgovrani/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|releases/download/[^/]+/|releases/download/$TAG/|; s|sha256 \"[0-9a-f]+\"|sha256 \"$sha\"|" Formula/claude-notifier.rb
          git diff --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: claude-notifier $TAG"
          git push origin main
